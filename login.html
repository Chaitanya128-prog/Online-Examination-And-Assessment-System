<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Online Examination System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ui-refinements.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-visual">
      <div class="visual-content">
        <img src="logo.png" alt="Exam Desk">
        <h1>Online Exam and Assesment Portal</h1>
      </div>
    </section>

    <section class="auth-card-wrap">
      <div class="auth-card">
        <div class="mobile-brand"><img src="logo.png" alt="Online Examination System"></div>
        <div class="card-heading">
          <h2>Login</h2>
        </div>

        <form id="loginForm">
          <label for="role">Login as</label>
          <select id="role" name="role">
            <option value="student">Student</option>
            <option value="examiner">Examiner</option>
          </select>

          <label for="roll">Roll Number / Employee ID</label>
          <input id="roll" type="text" inputmode="numeric" maxlength="10" placeholder="Enter your roll number or employee ID" required>

          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Password" required>

          <p class="form-error" id="error"></p>

          <div class="form-row">
            <label class="check"><input type="checkbox" id="remember"> Remember me</label>
            <label class="check"><input type="checkbox" id="showPassword"> Show password</label>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Login</button>
          <a class="forgot-link" href="#" id="forgotLink">Forgot password?</a>
        </form>

        <p class="auth-switch">New student? <a href="register.html">Create an account</a></p>

       
        <div class="secure-note">Having trouble logging in? Contact the exam cell.</div>
      </div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
