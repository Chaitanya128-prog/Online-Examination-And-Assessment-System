<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Online Examination System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ui-refinements.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-visual">
      <div class="visual-content">
        <img src="logo.png" alt="Exam Desk">
        <h1>Online Exam and Assesment Portal</h1>
      </div>
    </section>

    <section class="auth-card-wrap">
      <div class="auth-card">
        <div class="mobile-brand"><img src="logo.png" alt="Online Examination System"></div>
        <div class="card-heading">
          <h2>Student Registration</h2>
        </div>

        <form id="registerForm">
          <label for="fullName">Full Name</label>
          <input id="fullName" type="text" maxlength="40" placeholder="Enter your full name" required>

          <label for="roll">Roll Number</label>
          <input id="roll" type="text" inputmode="numeric" maxlength="10" placeholder="Enter your roll number" required>

          <label for="email">Email</label>
          <input id="email" type="email" placeholder="name@example.com" required>

          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Minimum 6 characters" required>
          <p class="strength" id="strengthText"></p>

          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" type="password" placeholder="Type password again" required>

          <p class="form-error" id="error"></p>
          <p class="form-success" id="success"></p>

          <div class="form-row">
            <label class="check"><input type="checkbox" id="showPassword"> Show password</label>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Register</button>
        </form>

        <p class="auth-switch">Already registered? <a href="login.html">Login</a></p>
      </div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
