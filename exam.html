<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam | Online Examination System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ui-refinements.css">
</head>
<body class="exam-page">
  <header class="exam-topbar">
    <a class="brand dark" href="#"><img src="logo.png" alt="Online Examination System"></a>
    <div class="exam-title"><strong id="examTitle">Loading...</strong><small id="examInfo"></small></div>
    <div class="timer"><span>TIME LEFT</span><strong id="timerText">00:00</strong></div>
  </header>

  <div class="exam-layout">
    <main class="question-area">
      <div class="question-top">
        <span class="question-count">Question <strong id="questionNo">1</strong> of <span id="questionTotal">0</span></span>
        <span class="marks" id="marksInfo"></span>
      </div>

      <article class="question-card">
        <span class="eyebrow" id="questionLabel">Question 1</span>
        <h1 id="questionText"></h1>

        <div class="options" id="optionsBox"></div>

        <div class="question-actions">
          <button class="btn btn-outline" id="prevBtn" type="button">Previous</button>
          <button class="btn btn-outline" id="clearBtn" type="button">Clear Answer</button>
          <button class="btn btn-review" id="reviewBtn" type="button">Mark for Review</button>
          <button class="btn btn-primary" id="nextBtn" type="button">Save &amp; Next</button>
        </div>
      </article>

      <div class="exam-note"><strong>Note:</strong> Do not refresh the page during the exam. Marked questions can be revisited before submitting.</div>
    </main>

    <aside class="palette">
      <div class="palette-head"><span class="eyebrow">Questions</span><strong id="paletteCount">1 / 0</strong></div>
      <div class="legend">
        <span><i class="dot answered"></i> Answered</span>
        <span><i class="dot not-answered"></i> Not answered</span>
        <span><i class="dot review"></i> Marked for review</span>
      </div>
      <div class="palette-grid" id="paletteGrid"></div>
      <div class="palette-footer">
        <p id="paletteInfo"></p>
        <button class="btn btn-danger btn-full" id="submitBtn" type="button">Submit Exam</button>
      </div>
    </aside>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div><script src="js/common.js"></script>
  <script src="js/exam.js"></script>
</body>
</html>
