<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results | ExamDesk</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("examdesk.theme") || "light");</script>
</head>
<body>
  <header id="appHeader"></header>

  <main class="container page">
    <div class="empty" id="emptyBox" hidden>
      <i class="bi bi-journal-x" aria-hidden="true"></i>
      You have not attempted any exam yet.
      <br><a class="btn btn-primary" href="dashboard.html">Go to dashboard</a>
    </div>

    <div id="resultBox" hidden>
      <section class="page-head">
        <div>
          <span class="eyebrow" id="examCode">-</span>
          <h1>Exam result</h1>
          <p id="examLine"></p>
        </div>
        <div class="toolbar no-print" style="margin:0">
          <label class="sr-only" for="resultSelect">Choose a result</label>
          <select id="resultSelect"></select>
          <button type="button" class="btn btn-outline" onclick="window.print()"><i class="bi bi-printer" aria-hidden="true"></i> Print</button>
        </div>
      </section>

      <section class="score-hero">
        <div class="ring" id="ring"><div><strong id="percentText">0%</strong><small>score</small></div></div>
        <div>
          <span class="badge" id="statusTag">-</span>
          <h2 id="studentLine"></h2>
          <p id="heroText"></p>
        </div>
        <div class="score-total"><strong id="scoreText">0</strong><span id="totalText">out of 0</span></div>
      </section>

      <section class="card" id="remarksCard" style="margin-top:20px" hidden>
        <div class="profile-card"><span class="stat-icon brand"><i class="bi bi-chat-left-quote" aria-hidden="true"></i></span>
          <div style="flex:1"><strong>Examiner remarks</strong><p id="remarksText" style="margin-top:2px"></p><small class="muted" id="remarksBy"></small></div></div>
      </section>

      <section class="stat-grid" style="margin-top:20px">
        <div class="stat-card"><span class="stat-icon green"><i class="bi bi-check-lg" aria-hidden="true"></i></span><div><span>Correct</span><strong id="correctText">0</strong></div></div>
        <div class="stat-card"><span class="stat-icon red"><i class="bi bi-x-lg" aria-hidden="true"></i></span><div><span>Wrong</span><strong id="wrongText">0</strong></div></div>
        <div class="stat-card"><span class="stat-icon brand"><i class="bi bi-dash-lg" aria-hidden="true"></i></span><div><span>Skipped</span><strong id="skippedText">0</strong></div></div>
        <div class="stat-card"><span class="stat-icon orange"><i class="bi bi-people" aria-hidden="true"></i></span><div><span>Class average</span><strong id="classAvg">-</strong><small id="rankText"></small></div></div>
      </section>

      <section class="grid-2" style="margin-bottom:22px">
        <div class="card">
          <div class="card-head"><h2>Answer distribution</h2></div>
          <div class="chart" id="resultChart"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Attempt details</h2></div>
          <div class="summary-list" id="attemptDetails"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div><h2>Question-wise review</h2><p id="reviewSummary"></p></div>
          <div class="filter-chips no-print" id="reviewFilter">
            <button type="button" class="chip active" data-filter="all">All</button>
            <button type="button" class="chip" data-filter="correct">Correct</button>
            <button type="button" class="chip" data-filter="wrong">Wrong</button>
            <button type="button" class="chip" data-filter="skipped">Skipped</button>
            <button type="button" class="chip" data-filter="written">Written</button>
          </div>
        </div>
        <div id="reviewList"></div>
      </section>
    </div>
  </main>

  <footer id="appFooter"></footer>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
